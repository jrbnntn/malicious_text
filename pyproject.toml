[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malicious-text-detector"
version = "0.1.0"
description = "A text-based spam and malicious message detector"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "pandas>=2.0",
    "scikit-learn>=1.5,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
