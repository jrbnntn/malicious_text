<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Malicious Text Detector</title>
  </head>
  <body>
    <main>
      <h1>Malicious Text Detector</h1>
      <textarea
        id="message"
        rows="8"
        cols="60"
        maxlength="2000"
        placeholder="Enter a message"
      ></textarea>
      <br />
      <button id="check" type="button">Check message</button>
      <p id="result" role="status"></p>
    </main>

    <script>
      const message = document.querySelector("#message");
      const button = document.querySelector("#check");
      const result = document.querySelector("#result");

      button.addEventListener("click", async () => {
        result.textContent = "Checking...";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: message.value }),
          });
          const data = await response.json();

          if (!response.ok) {
            result.textContent =
              data.detail?.[0]?.msg || "Unable to check the message.";
            return;
          }

          result.textContent = `${data.label} (spam score: ${data.score.toFixed(3)})`;
        } catch (error) {
          result.textContent = "Unable to connect to the prediction API.";
        }
      });
    </script>
  </body>
</html>
